<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <title>빽투더퓨처 무근성 시즌2</title>

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <script>
    // 마커 인식 시 비디오 재생 / 벗어날 때 일시정지 핸들러
    AFRAME.registerComponent('video-handler', {
      schema: {
        vidId: { type: 'string', default: '' }
      },
      init: function () {
        var marker = this.el;
        this.vid = document.querySelector('#' + this.data.vidId);

        marker.addEventListener('markerFound', function () {
          if (this.vid) {
            this.vid.play();
          }
        }.bind(this));

        marker.addEventListener('markerLost', function () {
          if (this.vid) {
            this.vid.pause();
          }
        }.bind(this));
      }
    });
  </script>
</head>

<body style="margin: 0; overflow: hidden">
  <a-scene embedded arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 4x4_BCH_13_9_3; debugUIEnabled: false; trackingMethod: best; smooth: true; smoothCount: 10; smoothTolerance: 0.01; smoothThreshold: 5;">
   
    <!-- 7개의 비디오 태그 설정 (소리가 나도록 muted 제거 완료) -->
    <video id="vid01" src="./assets/vid01.mp4" preload="auto" loop="true" playsinline webkit-playsinline crossorigin="anonymous" style="display:none;"></video>
    <video id="vid02" src="./assets/vid02.mp4" preload="auto" loop="true" playsinline webkit-playsinline crossorigin="anonymous" style="display:none;"></video>
    <video id="vid03" src="./assets/vid03.mp4" preload="auto" loop="true" playsinline webkit-playsinline crossorigin="anonymous" style="display:none;"></video>
    <video id="vid04" src="./assets/vid04.mp4" preload="auto" loop="true" playsinline webkit-playsinline crossorigin="anonymous" style="display:none;"></video>
    <video id="vid05" src="./assets/vid05.mp4" preload="auto" loop="true" playsinline webkit-playsinline crossorigin="anonymous" style="display:none;"></video>
    <video id="vid06" src="./assets/vid06.mp4" preload="auto" loop="true" playsinline webkit-playsinline crossorigin="anonymous" style="display:none;"></video>
    <video id="vid07" src="./assets/vid07.mp4" preload="auto" loop="true" playsinline webkit-playsinline crossorigin="anonymous" style="display:none;"></video>

    <!-- 바코드 마커 1번 ~ 7번 : 7개의 영상 매칭 -->
    <a-marker type="barcode" value="1" video-handler="vidId: vid01">
      <a-video src="#vid01" position="0 0.05 0" rotation="-90 0 0" scale="2 1.5 1" material="shader: flat;"></a-video>
    </a-marker>

    <a-marker type="barcode" value="2" video-handler="vidId: vid02">
      <a-video src="#vid02" position="0 0.05 0" rotation="-90 0 0" scale="2 1.5 1" material="shader: flat;"></a-video>
    </a-marker>

    <a-marker type="barcode" value="3" video-handler="vidId: vid03">
      <a-video src="#vid03" position="0 0.05 0" rotation="-90 0 0" scale="2 1.5 1" material="shader: flat;"></a-video>
    </a-marker>

    <a-marker type="barcode" value="4" video-handler="vidId: vid04">
      <a-video src="#vid04" position="0 0.05 0" rotation="-90 0 0" scale="2 1.5 1" material="shader: flat;"></a-video>
    </a-marker>

    <a-marker type="barcode" value="5" video-handler="vidId: vid05">
      <a-video src="#vid05" position="0 0.05 0" rotation="-90 0 0" scale="2 1.5 1" material="shader: flat;"></a-video>
    </a-marker>

    <a-marker type="barcode" value="6" video-handler="vidId: vid06">
      <a-video src="#vid06" position="0 0.05 0" rotation="-90 0 0" scale="2 1.5 1" material="shader: flat;"></a-video>
    </a-marker>

    <a-marker type="barcode" value="7" video-handler="vidId: vid07">
      <a-video src="#vid07" position="0 0.05 0" rotation="-90 0 0" scale="2 1.5 1" material="shader: flat;"></a-video>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>

</html>
